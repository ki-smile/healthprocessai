# HealthProcessAI Conda Environment
# Create environment: conda env create -f environment.yml
# Activate: conda activate healthprocessai

name: healthprocessai
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10
  
  # Core scientific packages (pinned versions for compatibility)
  - pandas>=2.0.0,<2.2.0
  - numpy>=1.24.0,<1.26.0
  - scipy>=1.10.0,<1.12.0
  - matplotlib>=3.6.0
  - seaborn>=0.12.0
  
  # Process mining
  - pip  # PM4PY must be installed via pip
  
  # Visualization
  - graphviz
  - python-graphviz
  - pydot
  - networkx>=3.0
  
  # Jupyter
  - jupyter
  - jupyterlab>=3.6.0
  - ipykernel
  - notebook
  - nb_conda_kernels
  
  # Data formats
  - openpyxl>=3.1.0
  - xlrd>=2.0.1
  
  # Development tools
  - pytest>=7.2.0
  - black>=23.0.0
  - flake8>=6.0.0
  - mypy>=1.0.0
  
  # Documentation
  - markdown>=3.4.0
  
  # Machine learning (pinned for compatibility)
  - scikit-learn>=1.3.0,<1.4.0
  - threadpoolctl>=3.1.0,<3.3.0
  - joblib>=1.3.0,<1.4.0
  - statsmodels>=0.13.0
  
  # Additional utilities
  - python-dateutil>=2.8.2
  - requests>=2.28.0
  - python-dotenv>=1.0.0
  - pydantic>=2.0.0
  
  # Pip dependencies (not available in conda)
  - pip:
    - pm4py>=2.7.0
    - weasyprint>=58.0
    - pypdf>=3.0.0
    - nbconvert>=7.2.0
    - pytest-cov>=4.0.0
    - unittest-xml-reporting>=3.2.0

variables:
  HEALTHPROCESSAI_HOME: ${CONDA_PREFIX}